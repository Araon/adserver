name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
      COVERAGE_MIN: "78"
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Full verification gate
        run: ./scripts/verify.sh
      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: /tmp/adserver-verification/coverage.out
          if-no-files-found: error
